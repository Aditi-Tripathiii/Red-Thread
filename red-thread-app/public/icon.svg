<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle for Maskable Safe Zone -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Shield Base -->
  <path d="M256 70 C340 70 410 110 410 170 C410 290 330 380 256 440 C182 380 102 290 102 170 C102 110 172 70 256 70 Z" 
        fill="#131D33" stroke="url(#shieldGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- The Red Thread Intertwined Curve -->
  <path d="M160 210 C160 150 256 130 256 220 C256 310 352 290 352 350 C352 400 280 405 256 370" 
        fill="none" stroke="url(#threadGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Security Core (Lock Icon) -->
  <rect x="216" y="240" width="80" height="70" rx="16" fill="#06B6D4" />
  <path d="M232 240 V205 C232 190 242 180 256 180 C270 180 280 190 280 205 V240" 
        fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="275" r="8" fill="#070B14" />
  <path d="M256 283 V295" stroke="#070B14" stroke-width="6" stroke-linecap="round" />
</svg>
